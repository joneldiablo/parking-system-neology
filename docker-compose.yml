services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: parking_db
      POSTGRES_USER: parking_user
      POSTGRES_PASSWORD: parking_secret_2025
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking_user -d parking_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: parking_db
      DB_USER: parking_user
      DB_PASSWORD: parking_secret_2025
      SERVER_PORT: "8082"
      JWT_SECRET: "${JWT_SECRET}"
      JWT_EXPIRATION_HOURS: "${JWT_EXPIRATION_HOURS:-3}"
      SUPERADMIN_USER: "${SUPERADMIN_USER:-superadmin}"
      SUPERADMIN_PASSWORD: "${SUPERADMIN_PASSWORD}"
    ports:
      - "8082:8082"
    depends_on:
      db:
        condition: service_healthy

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    restart: unless-stopped
    environment:
      KIOSK_PORT: "8443"
      KIOSK_UPSTREAM: app:8082
      KIOSK_CERT_HOST: "${KIOSK_CERT_HOST:-192.168.0.80}"
    ports:
      - "8443:8443"
    depends_on:
      - app

volumes:
  pgdata: