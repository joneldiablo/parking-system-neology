spring.application.name=parking-system

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:parking_db}
spring.datasource.username=${DB_USER:parking_user}
spring.datasource.password=${DB_PASSWORD:parking_secret_2025}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${SERVER_PORT:8080}

# Spring MVC
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true

# Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Seguridad / JWT
# - El JWT se firma con HMAC y dentro solo viaja el id de usuario CIFRADO (AES/GCM).
# - Vigencia del token en horas (por defecto 3).
jwt.secret=${JWT_SECRET:dev-secret-cambiar-en-produccion-2026}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:3}

# Superadmin inicial (se crea/actualiza al arrancar solo desde variables de entorno)
superadmin.user=${SUPERADMIN_USER:}
superadmin.password=${SUPERADMIN_PASSWORD:}
