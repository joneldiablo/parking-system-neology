<div class="row justify-content-center">
  <div class="col-md-5 col-lg-4">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="bg-primary text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width:64px;height:64px;">
            <i class="bi bi-shield-lock" style="font-size:2rem;"></i>
          </div>
          <h4 class="mb-1">Parking System</h4>
          <p class="text-body-secondary small mb-0">Acceso administradores</p>
        </div>

        <form (ngSubmit)="login()" #loginForm="ngForm">
          <div class="mb-3">
            <label for="username" class="form-label">Usuario</label>
            <input type="text" id="username" name="username" class="form-control text-center text-uppercase"
                   [(ngModel)]="username" #uname="ngModel" required autofocus placeholder="usuario">
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" name="password" class="form-control text-center"
                   [(ngModel)]="password" #pwd="ngModel" required placeholder="••••••••">
          </div>

          <div *ngIf="error" class="alert alert-danger py-2 small" role="alert">
            {{ error }}
          </div>

          <button type="submit" class="btn btn-primary w-100" [disabled]="loading || loginForm.invalid">
            <span *ngIf="loading" class="spinner-border spinner-border-sm me-2" role="status"></span>
            Iniciar sesión
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
