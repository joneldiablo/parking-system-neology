<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a7f37'/%3E%3Ctext x='8' y='12.5' font-size='11' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b1020">
  <title>Car QR · Kiosko de Acceso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --bg: #0b1020;
      --panel: #141a30;
      --ok: #1bbf73;
      --ko: #e0524d;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: var(--bg);
      color: #e8ecf8;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    #app { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 1rem; }

    .brand { display: flex; align-items: center; gap: .7rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .brand i { font-size: 1.6rem; color: #7fb2ff; }
    .brand small { color: #8894b8; font-weight: 500; letter-spacing: .1em; }

    .reader-wrap { position: relative; width: min(72vw, 520px); aspect-ratio: 1/1; }
    #reader { width: 100% !important; height: 100% !important; border-radius: 1.25rem; overflow: hidden; }
    #reader video { border-radius: 1.25rem; object-fit: cover; }
    .reader-frame {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      border: 4px solid rgba(255,255,255,.16);
      border-radius: 1.25rem;
    }
    .reader-frame::after {
      content: ""; position: absolute; inset: 22%;
      border: 5px solid #7fb2ff; border-radius: .9rem;
      box-shadow: 0 0 0 600px rgba(11,16,32,.32);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 50% { box-shadow: 0 0 0 600px rgba(11,16,32,.42), 0 0 26px #7fb2ff; } }

    .hint { font-size: 1.35rem; font-weight: 600; color: #c9d3ef; text-align: center; min-height: 2.2rem; }
    .sub-hint { color: #8894b8; font-size: .95rem; text-align: center; }

    .manual { position: fixed; left: .75rem; bottom: .75rem; width: 220px; opacity: .85; }
    .manual input { text-transform: uppercase; }

    .cam-badge {
      position: fixed; top: .75rem; right: .75rem;
      background: rgba(20,26,48,.85); border: 1px solid #2a3455;
      color: #8894b8; border-radius: 999px; padding: .35rem .8rem; font-size: .8rem;
    }
    .cam-badge.on { color: #5ee9a3; border-color: #1bbf73; }

    #overlay {
      position: fixed; inset: 0; z-index: 50; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 1.2rem;
      text-align: center; padding: 2rem;
    }
    #overlay.show { display: flex; }
    #overlay.ok    { background: linear-gradient(160deg, #0f7a4d, #0b5f3b); }
    #overlay.ko    { background: linear-gradient(160deg, #b23a35, #8f2c28); }
    #overlay.warn  { background: linear-gradient(160deg, #b07d22, #8a611a); }
    #overlay .btn-retry {
      margin-top: .75rem; padding: .9rem 2rem; font-size: 1.1rem; font-weight: 700;
      border-radius: .75rem; border: 0; cursor: pointer;
      background: rgba(255,255,255,.92); color: #0b1020;
    }
    #overlay.icon { font-size: 6rem; line-height: 1; }
    #overlay h1 { font-weight: 800; letter-spacing: .06em; font-size: clamp(2.4rem, 8vw, 4.5rem); margin: 0; text-transform: uppercase; }
    #overlay .placa {
      font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 800; letter-spacing: .35em;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace; text-transform: uppercase;
    }
    #overlay .detalle { font-size: clamp(1.1rem, 3vw, 1.6rem); opacity: .95; max-width: 90%; }
    #overlay .sub { font-size: .95rem; opacity: .8; }
  </style>
</head>
<body>
  <div id="app">
    <div class="brand">
      <i class="bi bi-qr-code-scan"></i>
      <div>Car&nbsp;QR<small>· kiosko de acceso · /neo</small></div>
    </div>

    <div class="hint" id="hint">Acerque el QR a la cámara</div>
    <div class="sub-hint" id="subhint">Vehículos con estancia activa = salida · sin activa = entrada</div>

    <div class="reader-wrap">
      <div id="reader"></div>
      <div class="reader-frame"></div>
    </div>
  </div>

  <div class="cam-badge" id="camBadge">● Cámara: iniciando…</div>

  <div class="manual">
    <input id="manualInput" class="form-control form-control-sm text-center" placeholder="Placa (pruebas)" maxlength="10" autocomplete="off">
  </div>

  <div id="overlay">
    <div class="icon" id="ovIcon"></div>
    <h1 id="ovTitle">…</h1>
    <div class="placa" id="ovPlaca"></div>
    <div class="detalle" id="ovDetail"></div>
    <div class="sub" id="ovSub"></div>
    <button class="btn-retry" id="ovBtn" style="display:none">▶ Reintentar cámara</button>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    (() => {
      // ── Configuración API ─────────────────────────────────────────────────
      const API_BASE = (() => {
        const override = (localStorage.getItem('kiosk.api') || '').trim();
        if (override) return override.replace(/\/+$/, '');
        const viaSpring = location.protocol === 'https:' || location.port === '8082';
        if (viaSpring) return '/neo';
        // El kiosko puede abrirse desde cualquier host (LAN): usa el mismo
        // hostname desde el que se sirvió la página para llegar a la API.
        return `${location.protocol}//${location.hostname}:8082/neo`;
      })();

      let scanner = null;
      let processing = false;
      let timers = [];

      const $ = (id) => document.getElementById(id);
      const camBadge = $('camBadge');

      // ── Sonido (WebAudio, sin librerías) ─────────────────────────────────
      // El AudioContext solo puede sonar tras un gesto del usuario (autoplay
      // policy): se crea de forma perezosa y se resuelve en el primer gesto.
      let audioCtx = null;
      function ensureAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }
      document.addEventListener('pointerdown', ensureAudio, { once: true });
      document.addEventListener('keydown', ensureAudio, { once: true });
      function beep(ok) {
        let ctx;
        try { ctx = ensureAudio(); } catch (e) { return; }
        if (ctx.state !== 'running') return;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        const t = ctx.currentTime;
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + (ok ? 0.5 : 0.7));
        if (ok) { o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + 0.12); }
        else { o.frequency.setValueAtTime(220, t); o.frequency.setValueAtTime(160, t + 0.15); }
        o.start(t); o.stop(t + (ok ? 0.55 : 0.75));
      }

      // ── Feedback en pantalla completa ────────────────────────────────────
      function showResult(kind, title, detail, placa) {
        processing = false;
        const ov = $('overlay');
        ov.className = 'show ' + kind;
        $('ovIcon').textContent = kind === 'ok' ? '✓' : '✕';
        $('ovIcon').textContent = kind === 'ok'
          ? (title === 'BIENVENIDO' ? '🚗' : '👋')
          : '⛔';
        $('ovTitle').textContent = title;
        $('ovPlaca').textContent = placa || '';
        $('ovDetail').textContent = detail || '';
        $('ovSub').textContent = 'Cerrando en unos segundos…';
        $('ovBtn').style.display = 'none';
        beep(kind === 'ok');
        clearTimers();
        timers.push(setTimeout(() => { ov.className = ''; startScanner(); }, 4500));
      }

      function clearTimers() {
        timers.forEach(clearTimeout);
        timers = [];
      }

      // ── Lógica de negocio: entrada o salida según estancia activa ────────
      async function handlePlaca(raw) {
        if (processing) return;
        processing = true;
        const placa = (raw || '').toString().toUpperCase().replace(/\s/g, '');
        if (!/^[A-Z0-9]{3,10}$/.test(placa)) {
          showResult('ko', 'QR INVÁLIDO', 'El código escaneado no corresponde a una placa', placa);
          return;
        }
        stopScanner();
        try {
          const est = await (await fetch(`${API_BASE}/estancias/${placa}`)).json();
          const activa = Array.isArray(est) && est.some(e => !e.fechaSalida);
          const endpoint = activa ? 'salida' : 'entrada';

          const res = await fetch(`${API_BASE}/estancias/${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ placa })
          });
          const data = await res.json();
          if (!res.ok) {
            showResult('ko', 'ACCESO DENEGADO', data?.mensaje || `No reconocido (${res.status})`, placa);
            return;
          }
          if (endpoint === 'entrada') {
            showResult('ok', 'BIENVENIDO', 'Entrada registrada correctamente', placa);
          } else {
            const costo = (+data?.costoTotal || 0);
            showResult('ok', 'ADIOS', `Salida registrada · Costo $${costo.toFixed(2)}`, placa);
          }
        } catch (e) {
          showResult('ko', 'SIN CONEXIÓN', `No se pudo contactar el sistema (${API_BASE})`, placa);
        } finally {
          setTimeout(() => { processing = false; startScanner(); }, 5200);
        }
      }

      // ── Cámara (html5-qrcode) ────────────────────────────────────────────
      let permStatus = null;

      function setCam(on, msg) {
        camBadge.textContent = on ? '● Cámara: activa' : '● Cámara: ' + msg;
        camBadge.classList.toggle('on', !!on);
      }

      function applyPermBadge(state) {
        if (state === 'granted') setCam(true, '');
        else if (state === 'denied') setCam(false, 'permiso bloqueado');
        else setCam(false, 'permiso pendiente');
      }

      function hideBlocked() {
        const ov = $('overlay');
        ov.className = '';
        $('ovBtn').style.display = 'none';
      }

      function showBlocked(cause) {
        const ov = $('overlay');
        ov.className = 'show warn';
        $('ovIcon').textContent = '📷';
        if (cause === 'insecure') {
          $('ovTitle').textContent = 'CÁMARA NO DISPONIBLE';
          $('ovDetail').textContent = 'Este navegador solo permite la cámara en conexiones seguras (https:// o http://localhost).';
          $('ovSub').textContent = 'Estás viendo el kiosko por «No seguro» (http:// con IP de red): Chrome/Brave desactivan getUserMedia ahí. Abre http://localhost:8090 o sirve el kiosko por HTTPS.';
        } else {
          $('ovTitle').textContent = 'CÁMARA BLOQUEADA';
          $('ovDetail').textContent = 'El navegador no tiene permiso para usar la cámara.';
          $('ovSub').textContent = 'Haz clic en el candado 🔒 de la barra de direcciones y activa «Cámara», o compruébalo desde los ajustes del navegador.';
        }
        $('ovPlaca').textContent = '';
        $('ovBtn').style.display = 'inline-block';
        beep(false);
      }

      async function checkCameraPermission() {
        camBadge.textContent = '● Cámara: comprobando permiso…';
        if (navigator.permissions && navigator.permissions.query) {
          try {
            permStatus = await navigator.permissions.query({ name: 'camera' });
            permStatus.addEventListener('change', () => {
              if (permStatus.state === 'granted') { hideBlocked(); startScanner(); }
              else if (permStatus.state === 'denied') stopScanner();
            });
          } catch (e) {
            // Permisos API no soporta 'camera' aquí: seguimos normal
          }
        }

        // Contexto no seguro (http:// por IP) → Chrome/Brave no exponen getUserMedia.
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setCam(false, 'getUserMedia no disponible');
          showBlocked('insecure');
          return;
        }

        // Alerta para separar el flujo: al pulsar «Aceptar» se lanza la solicitud,
        // así es visible si el navegador pide el permiso o no.
        alert('El kiosko va a pedir permiso para usar la cámara.\nPulsa «Aceptar» y el navegador lanzará la solicitud.');
        requestCameraPermission();
      }

      async function requestCameraPermission() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          stream.getTracks().forEach((t) => t.stop());
          hideBlocked();
          startScanner();
        } catch (e) {
          const name = (e && e.name) || 'error';
          applyPermBadge('denied');
          // Diagnóstico visible: si el «Sí» no trajo el prompt, este error lo revela.
          alert('No se pudo activar la cámara (' + name + ').\nSi cerraste la petición por error, pulsa «Reintentar» en la pantalla.');
          startScanner();
        }
      }

      async function startScanner() {
        if (scanner || processing) return;
        if (!window.Html5Qrcode) { setCam(false, 'librería no cargada'); return; }
        const el = $('reader');
        scanner = new Html5Qrcode(el.id);
        try {
          await scanner.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: Math.min(240, Math.floor(el.clientWidth * 0.72)) },
            (decoded) => handlePlaca(decoded),
            () => {}
          );
          setCam(true);
        } catch (e) {
          scanner = null;
          const msg = (e && e.message) || '';
          if (/notallowed|permission|denied|unable|notreadable/i.test(msg)) {
            applyPermBadge('denied');
            showBlocked();
          } else {
            setCam(false, msg || 'no disponible');
          }
        }
      }

      function stopScanner() {
        if (!scanner) return;
        const s = scanner;
        scanner = null;
        s.stop().then(() => s.clear()).catch(() => {});
      }

      // ── Ingreso manual (fallback / pruebas) ──────────────────────────────
      const manual = $('manualInput');
      manual.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter' && manual.value.trim()) {
          handlePlaca(manual.value);
          manual.value = '';
        }
      });

      window.addEventListener('beforeunload', stopScanner);
      $('ovBtn').addEventListener('click', () => {
        hideBlocked();
        requestCameraPermission();
      });
      checkCameraPermission();
    })();
  </script>
</body>
</html>
