<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232196f3'/%3E%3Ctext x='8' y='12.5' font-size='11' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E">
  <meta name="theme-color" content="#2196f3">
  <title>Car QR · Kiosko de Acceso</title>
  <link href="styles.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    /* Fondo con tintes del tema material */
    body {
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(33, 150, 243, .18), transparent 60%),
        radial-gradient(1000px 500px at 110% 110%, rgba(33, 150, 243, .12), transparent 60%),
        var(--bs-body-bg);
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
    }
    .app-shell { min-height: 100vh; }

    .kiosk-card { max-width: 560px; width: 100%; }

    .reader-wrap { position: relative; width: min(76vw, 460px); aspect-ratio: 1/1; margin: 0 auto; }
    #reader { width: 100% !important; height: 100% !important; border-radius: 1.25rem; overflow: hidden; background: #0b1020; }
    #reader video { object-fit: cover; border-radius: 1.25rem; }

    .reader-frame {
      position: absolute; inset: 0; pointer-events: none; z-index: 2;
      border-radius: 1.25rem;
      box-shadow: inset 0 0 0 3px rgba(33, 150, 243, .85);
    }
    .reader-frame::before {
      content: ""; position: absolute; left: 6%; right: 6%; top: -6px; height: 3px;
      border-radius: 999px; background: linear-gradient(90deg, transparent, var(--bs-primary), transparent);
      animation: scanline 2.6s ease-in-out infinite;
    }
    .reader-frame::after {
      content: ""; position: absolute; inset: 22%; border: 4px solid rgba(255, 255, 255, .55);
      border-radius: 1rem; box-shadow: 0 0 0 600px rgba(11, 16, 32, .30);
      animation: pulse 1.8s ease-in-out infinite;
    }
    @keyframes pulse { 50% { box-shadow: 0 0 0 600px rgba(11, 16, 32, .42), 0 0 26px var(--bs-primary); } }
    @keyframes scanline { 0%, 100% { top: 12%; } 50% { top: 86%; } }

    .cam-badge { transition: all .2s ease; }
    .cam-badge.on { background: var(--bs-success-bg-subtle) !important; color: var(--bs-success) !important; border-color: var(--bs-success) !important; }

    .manual {
      position: fixed; left: .75rem; bottom: .75rem; z-index: 40;
      width: min(320px, calc(100vw - 1.5rem)); opacity: .92;
    }

    #overlay {
      position: fixed; inset: 0; z-index: 50; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 1.1rem;
      text-align: center; padding: 2rem; color: #fff;
    }
    #overlay.show { display: flex; }
    #overlay.ok   { background: linear-gradient(160deg, #1b8a5a, #0f7a4d); }
    #overlay.ko   { background: linear-gradient(160deg, #d8433b, #ab3028); }
    #overlay.warn { background: linear-gradient(160deg, #e0892d, #b86a1a); }
    #overlay .icon { font-size: clamp(3.4rem, 12vw, 6rem); line-height: 1; }
    #overlay h1 { font-weight: 800; letter-spacing: .06em; font-size: clamp(2.2rem, 8vw, 4rem); margin: 0; text-transform: uppercase; }
    #overlay .placa {
      font-size: clamp(1.9rem, 6vw, 3.2rem); font-weight: 800; letter-spacing: .35em;
      font-family: ui-monospace, "Cascadia Code", Consolas, monospace; text-transform: uppercase;
    }
    #overlay .detalle { font-size: clamp(1.05rem, 3vw, 1.5rem); opacity: .95; max-width: 90%; }
    #overlay .sub { font-size: .95rem; opacity: .85; }
    #overlay .btn-retry {
      margin-top: .75rem; padding: .8rem 1.9rem; font-size: 1.05rem; font-weight: 700;
      border-radius: 999px; border: 0; cursor: pointer;
      background: rgba(255, 255, 255, .94); color: #212529;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .25);
    }
  </style>
</head>
<body>
  <div class="container app-shell d-flex align-items-center justify-content-center py-4">
    <div class="card kiosk-card border-0 shadow rounded-4">
      <div class="card-body p-4 p-md-5 text-center">

        <div class="d-flex align-items-center justify-content-between mb-4">
          <h1 class="h4 mb-0 fw-bold d-flex align-items-center gap-2 text-body">
            <i class="bi bi-qr-code-scan text-primary fs-3"></i>
            Kiosko de Acceso
          </h1>
          <span class="badge rounded-pill text-bg-light border cam-badge" id="camBadge">● Cámara: iniciando…</span>
        </div>

        <p class="mb-1 fs-5 fw-semibold" id="hint">Acerque el QR a la cámara</p>
        <p class="text-body-secondary small mb-4" id="subhint">Con estancia activa = salida · sin activa = entrada</p>

        <div class="reader-wrap">
          <div id="reader" class="d-flex align-items-center"></div>
          <div class="reader-frame"></div>
        </div>

      </div>
    </div>
  </div>

  <div class="manual">
    <div class="input-group input-group-sm">
      <span class="input-group-text"><i class="bi bi-keyboard"></i></span>
      <input id="manualInput" class="form-control text-center text-uppercase" placeholder="Placa (pruebas)" maxlength="10" autocomplete="off">
      <button id="manualBtn" class="btn btn-primary" type="button"><i class="bi bi-arrow-return-left"></i></button>
    </div>
  </div>

  <div id="overlay">
    <div class="icon" id="ovIcon"></div>
    <h1 id="ovTitle">…</h1>
    <div class="placa" id="ovPlaca"></div>
    <div class="detalle" id="ovDetail"></div>
    <div class="sub" id="ovSub"></div>
    <button class="btn-retry" id="ovBtn" style="display:none">▶ Reintentar cámara</button>
  </div>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    (() => {
      // ── Configuración API ─────────────────────────────────────────────────
      const API_BASE = (() => {
        const override = (localStorage.getItem('kiosk.api') || '').trim();
        if (override) return override.replace(/\/+$/, '');
        const viaSpring = location.protocol === 'https:' || location.port === '8082';
        if (viaSpring) return '/neo';
        return `${location.protocol}//${location.hostname}:8082/neo`;
      })();

      let scanner = null;
      let processing = false;
      let timers = [];

      const $ = (id) => document.getElementById(id);
      const camBadge = $('camBadge');

      // ── Sonido (WebAudio, sin librerías) ─────────────────────────────────
      let audioCtx = null;
      function ensureAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return audioCtx;
      }
      document.addEventListener('pointerdown', ensureAudio, { once: true });
      document.addEventListener('keydown', ensureAudio, { once: true });
      function beep(ok) {
        let ctx;
        try { ctx = ensureAudio(); } catch (e) { return; }
        if (ctx.state !== 'running') return;
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        const t = ctx.currentTime;
        g.gain.setValueAtTime(0.001, t);
        g.gain.exponentialRampToValueAtTime(0.35, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, t + (ok ? 0.5 : 0.7));
        if (ok) { o.frequency.setValueAtTime(880, t); o.frequency.setValueAtTime(1320, t + 0.12); }
        else { o.frequency.setValueAtTime(220, t); o.frequency.setValueAtTime(160, t + 0.15); }
        o.start(t); o.stop(t + (ok ? 0.55 : 0.75));
      }

      // ── Feedback en pantalla completa ────────────────────────────────────
      function showResult(kind, title, detail, placa) {
        processing = false;
        const ov = $('overlay');
        ov.className = 'show ' + kind;
        $('ovIcon').textContent = kind === 'ok'
          ? (title === 'BIENVENIDO' ? '🚗' : '👋')
          : '⛔';
        $('ovTitle').textContent = title;
        $('ovPlaca').textContent = placa || '';
        $('ovDetail').textContent = detail || '';
        $('ovSub').textContent = 'Cerrando en unos segundos…';
        $('ovBtn').style.display = 'none';
        beep(kind === 'ok');
        clearTimers();
        timers.push(setTimeout(() => { ov.className = ''; startScanner(); }, 4500));
      }

      function clearTimers() {
        timers.forEach(clearTimeout);
        timers = [];
      }

      // ── Lógica de negocio: entrada o salida según estancia activa ────────
      async function handlePlaca(raw) {
        if (processing) return;
        processing = true;
        const placa = (raw || '').toString().toUpperCase().replace(/\s/g, '');
        if (!/^[A-Z0-9]{3,10}$/.test(placa)) {
          showResult('ko', 'QR INVÁLIDO', 'El código escaneado no corresponde a una placa', placa);
          return;
        }
        stopScanner();
        try {
          const est = await (await fetch(`${API_BASE}/estancias/${placa}`)).json();
          const activa = Array.isArray(est) && est.some(e => !e.fechaSalida);
          const endpoint = activa ? 'salida' : 'entrada';

          const res = await fetch(`${API_BASE}/estancias/${endpoint}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ placa })
          });
          const data = await res.json();
          if (!res.ok) {
            showResult('ko', 'ACCESO DENEGADO', data?.mensaje || `No reconocido (${res.status})`, placa);
            return;
          }
          if (endpoint === 'entrada') {
            showResult('ok', 'BIENVENIDO', 'Entrada registrada correctamente', placa);
          } else {
            const costo = (+data?.costoTotal || 0);
            showResult('ok', 'ADIOS', `Salida registrada · Costo $${costo.toFixed(2)}`, placa);
          }
        } catch (e) {
          showResult('ko', 'SIN CONEXIÓN', `No se pudo contactar el sistema (${API_BASE})`, placa);
        } finally {
          setTimeout(() => { processing = false; startScanner(); }, 5200);
        }
      }

      // ── Cámara (html5-qrcode) ────────────────────────────────────────────
      let permStatus = null;

      function setCam(on, msg) {
        camBadge.textContent = on ? '● Cámara: activa' : '● Cámara: ' + msg;
        camBadge.classList.toggle('on', !!on);
      }

      function applyPermBadge(state) {
        if (state === 'granted') setCam(true, '');
        else if (state === 'denied') setCam(false, 'permiso bloqueado');
        else setCam(false, 'permiso pendiente');
      }

      function hideBlocked() {
        const ov = $('overlay');
        ov.className = '';
        $('ovBtn').style.display = 'none';
      }

      function showBlocked(cause) {
        const ov = $('overlay');
        ov.className = 'show warn';
        $('ovIcon').textContent = '📷';
        if (cause === 'insecure') {
          $('ovTitle').textContent = 'CÁMARA NO DISPONIBLE';
          $('ovDetail').textContent = 'Este navegador solo permite la cámara en conexiones seguras (https:// o http://localhost).';
          $('ovSub').textContent = 'Estás viendo el kiosko por «No seguro» (http:// con IP de red): Chrome/Brave desactivan getUserMedia ahí. Abre http://localhost:8090 o sirve el kiosko por HTTPS.';
        } else {
          $('ovTitle').textContent = 'CÁMARA BLOQUEADA';
          $('ovDetail').textContent = 'El navegador no tiene permiso para usar la cámara.';
          $('ovSub').textContent = 'Haz clic en el candado 🔒 de la barra de direcciones y activa «Cámara», o compruébalo desde los ajustes del navegador.';
        }
        $('ovPlaca').textContent = '';
        $('ovBtn').style.display = 'inline-block';
        beep(false);
      }

      async function checkCameraPermission() {
        camBadge.textContent = '● Cámara: comprobando permiso…';
        if (navigator.permissions && navigator.permissions.query) {
          try {
            permStatus = await navigator.permissions.query({ name: 'camera' });
            permStatus.addEventListener('change', () => {
              if (permStatus.state === 'granted') { hideBlocked(); startScanner(); }
              else if (permStatus.state === 'denied') stopScanner();
            });
          } catch (e) {
            // Permisos API no soporta 'camera' aquí: seguimos normal
          }
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setCam(false, 'getUserMedia no disponible');
          showBlocked('insecure');
          return;
        }

        alert('El kiosko va a pedir permiso para usar la cámara.\nPulsa «Aceptar» y el navegador lanzará la solicitud.');
        requestCameraPermission();
      }

      async function requestCameraPermission() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          stream.getTracks().forEach((t) => t.stop());
          hideBlocked();
          startScanner();
        } catch (e) {
          const name = (e && e.name) || 'error';
          applyPermBadge('denied');
          alert('No se pudo activar la cámara (' + name + ').\nSi cerraste la petición por error, pulsa «Reintentar» en la pantalla.');
          startScanner();
        }
      }

      async function startScanner() {
        if (scanner || processing) return;
        if (!window.Html5Qrcode) { setCam(false, 'librería no cargada'); return; }
        const el = $('reader');
        scanner = new Html5Qrcode(el.id);
        try {
          await scanner.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: Math.min(240, Math.floor(el.clientWidth * 0.72)) },
            (decoded) => handlePlaca(decoded),
            () => {}
          );
          setCam(true);
        } catch (e) {
          scanner = null;
          const msg = (e && e.message) || '';
          if (/notallowed|permission|denied|unable|notreadable/i.test(msg)) {
            applyPermBadge('denied');
            showBlocked();
          } else {
            setCam(false, msg || 'no disponible');
          }
        }
      }

      function stopScanner() {
        if (!scanner) return;
        const s = scanner;
        scanner = null;
        s.stop().then(() => s.clear()).catch(() => {});
      }

      // ── Ingreso manual (fallback / pruebas) ──────────────────────────────
      const manual = $('manualInput');
      const enviarManual = () => {
        if (manual.value.trim()) {
          handlePlaca(manual.value);
          manual.value = '';
        }
      };
      manual.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') enviarManual();
      });
      $('manualBtn').addEventListener('click', enviarManual);

      window.addEventListener('beforeunload', stopScanner);
      $('ovBtn').addEventListener('click', () => {
        hideBlocked();
        requestCameraPermission();
      });
      checkCameraPermission();
    })();
  </script>
</body>
</html>
